<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najm | Full CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        body { background-color: #0A0A0A; color: #E5E7EB; overflow-x: hidden; scroll-behavior: smooth; }
        
        .gsap-transform {
            transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
            will-change: transform; display: inline-block; 
        }

        :root { --rgb-split: 0; }
        .rgb-glitch {
            text-shadow: calc(var(--rgb-split) * 1px) 0 0 rgba(255, 0, 0, 0.8), 
                         calc(var(--rgb-split) * -1px) 0 0 rgba(0, 255, 255, 0.8);
            transition: text-shadow 0.1s ease-out;
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; 
            z-index: 9996; opacity: 0.03; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #saber-trail {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9995; mix-blend-mode: screen;
        }

        #domain-layer {
            position: fixed; top: 50%; left: 50%; width: 150vmax; height: 150vmax;
            background-color: #050505; border: 8px solid #3b82f6; box-shadow: inset 0 0 100px #3b82f6;
            border-radius: 50%; z-index: 99999; pointer-events: none;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white relative min-h-screen flex flex-col items-center justify-center p-20">

    <canvas id="saber-trail"></canvas>
    <div id="domain-layer"></div>
    <div class="noise-overlay"></div>

    <div class="relative z-10 text-center">
        <h1 class="bounce-element text-6xl md:text-8xl font-black text-white tracking-tighter mb-6 uppercase rgb-glitch">
            <span class="scramble-text" data-text="Data">Data</span> 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-teal-400 scramble-text" data-text="Extracted">Extracted</span>.
        </h1>
        <p class="bounce-element text-xl text-gray-400 max-w-2xl mx-auto mb-16 scramble-text" data-text="This is where your full professional CV will be rendered.">
            This is where your full professional CV will be rendered.
        </p>

        <div class="bounce-element">
            <a href="#" onclick="triggerDomainExpansion('index.html'); return false;" class="magnetic-btn gsap-transform inline-flex items-center gap-2 px-10 py-4 bg-white/5 border border-white/20 text-white font-bold rounded-full hover:bg-white/10 hover:border-teal-400 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                </svg>
                Return to Base
            </a>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBassDrop() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        function scrambleText(element) {
            const original = element.getAttribute('data-text');
            if(!original) return;
            const chars = '!<>-_\\/[]{}—=+*^?#________';
            let iteration = 0;
            const interval = setInterval(() => {
                element.innerText = original.split('').map((char, index) => {
                    if(index < iteration) return original[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                if(iteration >= original.length) clearInterval(interval);
                iteration += 1.5; 
            }, 20); 
        }

        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const scrollVelocity = Math.abs(currentScrollY - lastScrollY);
            const splitAmount = Math.min(scrollVelocity * 0.1, 10); 
            document.documentElement.style.setProperty('--rgb-split', splitAmount);
            lastScrollY = currentScrollY;
            
            clearTimeout(window.scrollTimeout);
            window.scrollTimeout = setTimeout(() => {
                document.documentElement.style.setProperty('--rgb-split', 0);
            }, 100);
        });

        const canvas = document.getElementById('saber-trail');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: -100, y: -100 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            for(let i=0; i<3; i++) {
                particles.push({
                    x: mouse.x, y: mouse.y,
                    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                    life: 1, size: Math.random() * 4 + 2
                });
            }
        });

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.03; 
                if(p.life <= 0) { particles.splice(i, 1); i--; continue; }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(45, 212, 191, ${p.life})`;
                ctx.shadowBlur = 15; ctx.shadowColor = '#3b82f6';
                ctx.fill();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('load', () => {
            gsap.to("#domain-layer", { scale: 0, duration: 1.2, ease: "power3.inOut" });
            gsap.from(".bounce-element", {
                y: 100, scale: 0.8, opacity: 0, duration: 1.5,
                stagger: 0.1, ease: "elastic.out(1, 0.4)",
                delay: 0.3,
                onStart: () => { document.querySelectorAll('.scramble-text').forEach(el => scrambleText(el)); }
            });
        });

        function triggerDomainExpansion(url) {
            playBassDrop();
            const domainLayer = document.getElementById('domain-layer');
            gsap.to(domainLayer, {
                scale: 1, duration: 1, ease: "power3.inOut",
                onStart: () => { document.body.style.overflow = 'hidden'; },
                onComplete: () => { window.location.href = url; }
            });
        }

        document.querySelectorAll('.magnetic-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                gsap.to(btn, { x: x * 0.4, y: y * 0.4, scale: 1.05, duration: 0.3, ease: "power2.out" });
            });
            btn.addEventListener('mouseleave', () => {
                gsap.to(btn, { x: 0, y: 0, scale: 1, duration: 0.7, ease: "elastic.out(1, 0.3)" });
            });
            btn.addEventListener('mousedown', () => gsap.to(btn, { scale: 0.95, duration: 0.1 }));
            btn.addEventListener('mouseup', () => gsap.to(btn, { scale: 1.05, duration: 0.3, ease: "back.out(2)" }));
        });
    </script>
</body>
</html>
